media:
  input: public/uploads
  output: /uploads

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{primary}.mdx"
    view:
      fields: [title, published, category, series, draft, pinned]
      primary: title
      sort: [published, title]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: published
        label: Published Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Updated Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: Description
        type: text
      - name: image
        label: Cover Image
        type: image
        description: Optional cover image. Leave blank or enable "Use Random Cover" below for Firefly's random cover API.
      - name: useRandomCover
        label: Use Random Cover (when image is blank)
        type: boolean
        default: false
      - name: tags
        label: Tags
        type: string
        list: true
      - name: category
        label: Category
        type: string
      - name: series
        label: Series Name
        type: string
      - name: seriesOrder
        label: Series Order
        type: number
      - name: author
        label: Author
        type: string
      - name: sourceLink
        label: Source Link
        type: string
      - name: licenseName
        label: License Name
        type: string
      - name: licenseUrl
        label: License URL
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: lang
        label: Language
        type: string
        default: en
      - name: pinned
        label: Pin to Top
        type: boolean
        default: false
      - name: comment
        label: Enable Comments
        type: boolean
        default: true
      - name: password
        label: Post Password (optional)
        type: string
      - name: passwordHint
        label: Password Hint
        type: string
      - name: body
        label: Content (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: events
    label: Events & Schedule
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, startDate, city, status, draft]
      primary: title
      sort: [startDate, title]
      default:
        sort: startDate
        order: desc
    fields:
      - name: title
        label: Event Title
        type: string
        required: true
      - name: startDate
        label: Start Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End Date (optional)
        type: date
        options:
          format: yyyy-MM-dd
      - name: venue
        label: Venue
        type: string
        required: true
      - name: city
        label: City
        type: string
        required: true
      - name: region
        label: Region
        type: select
        options:
          values:
            - Jabodetabek
            - Jawa Barat
            - Jawa Tengah & DIY
            - Jawa Timur
            - Bali & Nusa Tenggara
            - Sumatera
            - Kalimantan
            - Sulawesi
            - Maluku & Papua
            - Online
      - name: eventType
        label: Event Type
        type: select
        options:
          values:
            - Convention / Expo
            - Matsuri / Bunkasai
            - Idol / Anisong Live
            - Anikura / DJ Night
            - Cosplay Event
            - Doujin / Creator Market
            - Community Gathering
      - name: entryType
        label: Admission Type
        type: select
        default: tba
        options:
          values:
            - value: free
              label: Free Entry
            - value: paid
              label: Paid HTM
            - value: tba
              label: TBA
      - name: htm
        label: HTM / Ticket Price Label
        type: string
        description: Examples - "Free Entry", "Rp 50.000", "Presale Rp 75.000 / OTS Rp 100.000"
      - name: time
        label: Open Gate / Hours
        type: string
        description: Example - "10:00 - 21:00"
      - name: timezone
        label: Timezone
        type: select
        default: WIB
        options:
          values:
            - WIB
            - WITA
            - WIT
      - name: organizer
        label: Organizer (EO)
        type: string
      - name: instagram
        label: Official Instagram
        type: string
        description: Handle (@event.id) or full Instagram URL
      - name: officialUrl
        label: Official Link / Registration
        type: string
      - name: mapsUrl
        label: Google Maps Link
        type: string
      - name: highlights
        label: Activity Highlights
        type: string
        list: true
      - name: status
        label: Status
        type: select
        default: upcoming
        options:
          values:
            - value: upcoming
              label: Upcoming
            - value: ongoing
              label: Ongoing
            - value: completed
              label: Completed
            - value: postponed
              label: Postponed
            - value: cancelled
              label: Cancelled
      - name: majorEvent
        label: Big / Major Event (Featured on Home for Jabodetabek)
        type: boolean
        default: false
      - name: ticketUrl
        label: Ticket URL
        type: string
      - name: lineup
        label: Performer Lineup
        type: reference
        options:
          collection: performers
          multiple: true
          search: name
          label: "{name}"
          value: "{filename}"
      - name: description
        label: Summary
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        label: Event Banner Image
        type: image
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Event Notes (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: performers
    label: Performer Wiki
    type: collection
    path: src/content/performers
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [name, role, category, city, draft]
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Performer Name
        type: string
        required: true
      - name: role
        label: Primary Role
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values:
            - Anisong Vocalist
            - Band
            - Chika Idol
            - Fandom Idol
            - Anikura DJ
            - Collective Group
            - Cosplayer
            - Creator / Other
      - name: aliases
        label: Aliases / Stage Names
        type: string
        list: true
      - name: city
        label: Base City
        type: string
      - name: activeYears
        label: Active Years
        type: string
      - name: affiliation
        label: Group / Collective / Community Affiliation
        type: string
      - name: status
        label: Status
        type: string
        default: Active
      - name: bio
        label: Short Bio
        type: text
      - name: avatar
        label: Avatar Image
        type: image
      - name: infobox
        label: Extra Infobox Rows
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: value
            label: Value
            type: string
            required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: socials
        label: Social Links
        type: object
        list: true
        fields:
          - name: label
            label: Platform Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
          - name: icon
            label: Iconify Icon (e.g. fa7-brands:youtube)
            type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Bio & Notes (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: wiki
    label: Wiki Hub Articles
    type: collection
    path: src/content/wiki
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, featured, draft]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: category
        label: Wiki Category
        type: select
        required: true
        default: ACG & Jejepangan Scene
        options:
          values:
            - Event Series & Organizers
            - Axia Lore & Community
            - ACG & Jejepangan Scene
            - Communities & Circles
      - name: summary
        label: Summary
        type: text
      - name: aliases
        label: Aliases / Alternate Names
        type: string
        list: true
      - name: city
        label: City / Scope
        type: string
      - name: status
        label: Status
        type: string
        default: Active
      - name: founded
        label: Founded / Era
        type: string
      - name: updated
        label: Last Updated
        type: date
      - name: featured
        label: Feature on Wiki Hub
        type: boolean
        default: false
      - name: image
        label: Emblem / Cover Image
        type: image
      - name: infobox
        label: Infobox Rows
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: value
            label: Value
            type: string
            required: true
      - name: links
        label: External Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
          - name: icon
            label: Iconify Icon
            type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Wiki Content (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: about_page
    label: About Page
    type: file
    path: src/content/spec/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Page Title
        type: string
      - name: description
        label: Page Description
        type: text
      - name: body
        label: Page Content (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: guestbook_page
    label: Guestbook Page
    type: file
    path: src/content/spec/guestbook.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Page Title
        type: string
      - name: description
        label: Page Description
        type: text
      - name: body
        label: Page Content (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: dynamic
    label: Moments
    type: collection
    path: src/content/dynamic
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}.md"
    view:
      fields: [published, location, pinned]
      primary: location
      sort: [published]
      default:
        sort: published
        order: desc
    fields:
      - name: published
        label: Published Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: pinned
        label: Pin Moment
        type: boolean
        default: false
      - name: location
        label: Location
        type: string
      - name: body
        label: Moment Text (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, status, order, published, draft]
      primary: title
      sort: [order, published, title]
      default:
        sort: order
        order: desc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: published
        label: Published Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: order
        label: Sort Order
        type: number
      - name: status
        label: Project Status
        type: select
        default: active
        options:
          values:
            - active
            - completed
            - archived
            - planned
      - name: description
        label: Description
        type: text
      - name: image
        label: Cover Image
        type: image
      - name: useRandomCover
        label: Use Random Cover
        type: boolean
        default: false
      - name: tags
        label: Tags
        type: string
        list: true
      - name: lang
        label: Language
        type: string
        default: en
      - name: link
        label: Project Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: icon
            label: Iconify Icon
            type: string
          - name: value
            label: URL
            type: string
            required: true
      - name: body
        label: Project Details (Raw Markdown)
        type: code
        options:
          language: markdown

  - name: site_settings
    label: Site Settings
    type: file
    path: src/data/siteSettings.json
    format: json
    fields:
      - name: site
        label: Site Identity & Theme
        type: object
        fields:
          - name: title
            label: Site Title
            type: string
            required: true
          - name: subtitle
            label: Site Subtitle
            type: string
          - name: description
            label: Meta Description
            type: text
          - name: keywords
            label: SEO Keywords
            type: string
            list: true
          - name: themeHue
            label: Theme Hue (0 - 360)
            type: number
          - name: defaultMode
            label: Default Color Mode
            type: select
            options:
              values: [system, light, dark]
          - name: pageWidth
            label: Page Width (rem)
            type: number
          - name: navbarTitle
            label: Navbar Title
            type: string
          - name: siteStartDate
            label: Site Start Date (YYYY-MM-DD)
            type: string
          - name: timezone
            label: Site Timezone (IANA)
            type: string
          - name: uiLang
            label: UI Language
            type: select
            default: en
            options:
              values: [en, id]
          - name: postsPerPage
            label: Posts Per Page
            type: number
          - name: defaultPostLayout
            label: Default Post List Layout
            type: select
            options:
              values: [list, grid]
          - name: categoryBar
            label: Show Category Bar
            type: boolean
          - name: showLastModified
            label: Show Last Modified Card
            type: boolean
          - name: shareButtons
            label: Show Share Buttons
            type: boolean
          - name: relatedPosts
            label: Show Related Posts
            type: boolean
          - name: showHomeSchedule
            label: Show Homepage Upcoming Schedule
            type: boolean
            default: true
          - name: showHomeWikiSpotlight
            label: Show Homepage Wiki Spotlight
            type: boolean
          - name: showLoadingScreen
            label: Show Loading Screen
            type: boolean
            default: false
      - name: pages
        label: Page Toggles
        type: object
        fields:
          - name: friends
            label: Friends Page
            type: boolean
          - name: guestbook
            label: Guestbook Page
            type: boolean
          - name: dynamic
            label: Moments Page
            type: boolean
          - name: projects
            label: Projects Page
            type: boolean
          - name: gallery
            label: Gallery Page
            type: boolean
          - name: booknav
            label: Bookmarks Page
            type: boolean
          - name: sponsor
            label: Sponsor Page
            type: boolean
          - name: bilibili
            label: Bilibili Page
            type: boolean
          - name: bangumi
            label: Bangumi Page
            type: boolean
          - name: vndb
            label: VNDB Page
            type: boolean
          - name: mal
            label: MyAnimeList Page
            type: boolean
      - name: banner
        label: Hero Banner
        type: object
        fields:
          - name: mode
            label: Wallpaper Mode
            type: select
            options:
              values: [banner, fullscreen, overlay, none]
          - name: homeTextEnable
            label: Show Home Banner Text
            type: boolean
          - name: title
            label: Banner Title
            type: string
          - name: subtitles
            label: Banner Subtitles
            type: string
            list: true
          - name: typewriterEnable
            label: Enable Typewriter Effect
            type: boolean
          - name: dimOpacity
            label: Banner Dim Opacity (0 - 1)
            type: number
          - name: desktopImages
            label: Desktop Wallpaper Images (Upload or URL)
            type: image
            list: true
          - name: mobileImages
            label: Mobile Wallpaper Images (Upload or URL)
            type: image
            list: true
          - name: position
            label: Wallpaper Focal Position (CSS object-position)
            type: string
            description: Examples - "0% 20%", "center", "top"
          - name: wavesEnable
            label: Show Animated Waves
            type: boolean
          - name: carouselEnable
            label: Enable Wallpaper Carousel
            type: boolean
          - name: carouselInterval
            label: Carousel Interval (ms)
            type: number
          - name: carouselEffect
            label: Carousel Transition Effect
            type: select
            options:
              values: [fade, zoom, slide, kenburns]
      - name: music
        label: Music Player
        type: object
        fields:
          - name: showInNavbar
            label: Show in Navbar
            type: boolean
          - name: showInSidebar
            label: Show in Sidebar
            type: boolean
          - name: mode
            label: Player Source Mode
            type: select
            options:
              values: [local, meting]
          - name: volume
            label: Default Volume (0 - 1)
            type: number
          - name: playMode
            label: Default Play Mode
            type: select
            options:
              values: [list, one, random]
          - name: showLyrics
            label: Enable Lyrics Drawer
            type: boolean
          - name: showFloatingLyrics
            label: Enable Floating Lyrics
            type: boolean
          - name: playlist
            label: Local Playlist Tracks
            type: object
            list: true
            fields:
              - name: name
                label: Track Title
                type: string
                required: true
              - name: artist
                label: Artist
                type: string
                required: true
              - name: url
                label: Audio File / URL (.mp3, .ogg, .flac)
                type: file
                required: true
              - name: cover
                label: Cover Image
                type: image
              - name: lrc
                label: Lyrics (LRC Text or Path)
                type: text
          - name: meting
            label: Meting API Settings (when Mode = meting)
            type: object
            fields:
              - name: server
                label: Music Platform
                type: select
                options:
                  values: [netease, tencent, kugou, xiami, baidu]
              - name: type
                label: Source Type
                type: select
                options:
                  values: [playlist, song, album, search, artist]
              - name: id
                label: Playlist / Song / Album ID
                type: string
              - name: api
                label: Meting API URL
                type: string
              - name: auth
                label: Auth Token (optional)
                type: string
      - name: announcement
        label: Announcement Bar
        type: object
        fields:
          - name: title
            label: Announcement Title
            type: string
          - name: content
            label: Announcement Text
            type: text
          - name: closable
            label: Closable
            type: boolean
          - name: linkEnable
            label: Enable Action Link
            type: boolean
          - name: linkText
            label: Action Link Label
            type: string
          - name: linkUrl
            label: Action Link URL
            type: string
          - name: linkExternal
            label: Open External Tab
            type: boolean
      - name: profile
        label: Author Profile Sidebar
        type: object
        fields:
          - name: name
            label: Profile Name
            type: string
          - name: bio
            label: Profile Bio
            type: text
          - name: avatar
            label: Avatar Path / URL
            type: string
          - name: links
            label: Profile Social Links
            type: object
            list: true
            fields:
              - name: name
                label: Label
                type: string
                required: true
              - name: icon
                label: Iconify Icon
                type: string
                required: true
              - name: url
                label: URL
                type: string
                required: true
              - name: showName
                label: Show Text Label
                type: boolean
      - name: friends
        label: Friends Directory
        type: object
        list: true
        fields:
          - name: title
            label: Site Name
            type: string
            required: true
          - name: imgurl
            label: Avatar Image URL
            type: string
            required: true
          - name: desc
            label: Description
            type: string
            required: true
          - name: siteurl
            label: Site URL
            type: string
            required: true
          - name: tags
            label: Tags
            type: string
            list: true
          - name: weight
            label: Weight
            type: number
            required: true
          - name: enabled
            label: Enabled
            type: boolean
            required: true
      - name: booknav
        label: Bookmarks Groups
        type: object
        list: true
        fields:
          - name: id
            label: Group ID
            type: string
            required: true
          - name: name
            label: Group Name
            type: string
            required: true
          - name: icon
            label: Group Icon
            type: string
          - name: desc
            label: Description
            type: string
          - name: weight
            label: Weight
            type: number
          - name: enabled
            label: Enabled
            type: boolean
          - name: items
            label: Bookmark Items
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: url
                label: URL
                type: string
                required: true
              - name: desc
                label: Description
                type: string
              - name: icon
                label: Icon
                type: string
              - name: weight
                label: Weight
                type: number
              - name: enabled
                label: Enabled
                type: boolean
      - name: gallery
        label: Gallery Settings
        type: object
        fields:
          - name: columnWidth
            label: Column Width (px)
            type: number
          - name: albums
            label: Albums
            type: object
            list: true
            fields:
              - name: id
                label: Album ID / Folder
                type: string
                required: true
              - name: name
                label: Album Title
                type: string
                required: true
              - name: description
                label: Description
                type: text
              - name: date
                label: Date
                type: string
              - name: location
                label: Location
                type: string
              - name: tags
                label: Tags
                type: string
                list: true
              - name: cover
                label: Cover Image
                type: string
              - name: password
                label: Album Password
                type: string
              - name: passwordHint
                label: Password Hint
                type: string
      - name: sponsor
        label: Sponsor Page
        type: object
        fields:
          - name: title
            label: Page Title
            type: string
          - name: description
            label: Page Description
            type: text
          - name: usage
            label: Fund Usage Note
            type: text
          - name: showSponsorsList
            label: Show Sponsors List
            type: boolean
          - name: showComment
            label: Show Comments
            type: boolean
          - name: showButtonInPost
            label: Show Support Button in Posts
            type: boolean
      - name: analytics
        label: Analytics (Umami)
        type: object
        fields:
          - name: umamiWebsiteId
            label: Umami Website ID
            type: string
            description: Leave blank to disable analytics. Cookie-free privacy analytics powered by Umami.
          - name: umamiScriptUrl
            label: Umami Script URL
            type: string
            default: https://cloud.umami.is/script.js
          - name: trackOutboundLinks
            label: Track Outbound Links
            type: boolean
            default: true
          - name: collectWebVitals
            label: Collect Core Web Vitals
            type: boolean
            default: true
